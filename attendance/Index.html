<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출퇴근</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #15171c; --muted: #6b7280; --line: #e4e7ec;
    --chip: #eef1f5; --in: #0b8a4c; --in-bg: #e7f6ee; --out: #2557d6; --out-bg: #e9effd;
    --warn: #b45309; --warn-bg: #fdf3e3; --bad: #c62828; --bad-bg: #fdecec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa1ad; --line: #2a2f38;
      --chip: #22262e; --in: #3ccf86; --in-bg: #14271d; --out: #7aa2ff; --out-bg: #18213a;
      --warn: #f2b45a; --warn-bg: #2b2215; --bad: #ff7b7b; --bad-bg: #2d1717;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 20px 16px 40px; }
  header { text-align: center; padding: 8px 0 20px; }
  .store { font-size: 15px; font-weight: 600; color: var(--muted); }
  .clock { font-size: 52px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .date { color: var(--muted); }
  .card { background: var(--card); border-radius: 18px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04); }
  h2 { font-size: 17px; margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .group { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; }
  .group:first-child { margin-top: 0; }
  .pinhint { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; }
  .storetag { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .name {
    height: 56px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 14px; font: inherit; font-size: 18px; font-weight: 600;
  }
  .name:active { background: var(--chip); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .who { font-size: 22px; font-weight: 700; }
  .link { background: none; border: 0; color: var(--out); font: inherit; font-size: 15px; padding: 6px 0; cursor: pointer; }
  .today { margin: 6px 0 16px; color: var(--muted); }
  .today b { color: var(--text); font-weight: 600; }
  label.pin { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input.pin {
    width: 100%; height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    color: var(--text); font-size: 24px; letter-spacing: 8px; text-align: center; font-family: inherit;
  }
  input.pin:focus { outline: 2px solid var(--out); border-color: transparent; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin: 10px 0 0; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .big {
    height: 96px; border: 0; border-radius: 18px; font: inherit; font-size: 26px; font-weight: 700;
    color: #fff; cursor: pointer; transition: transform .05s, opacity .2s;
  }
  .big:active { transform: scale(.98); }
  .big.in { background: var(--in); }
  .big.out { background: var(--out); }
  .big:disabled { opacity: .3; }
  .result { margin-top: 16px; border-radius: 14px; padding: 14px 16px; }
  .result .t { font-size: 20px; font-weight: 700; }
  .result.ok { background: var(--in-bg); color: var(--in); }
  .result.warn { background: var(--warn-bg); color: var(--warn); }
  .result.bad { background: var(--bad-bg); color: var(--bad); }
  .result.busy { background: var(--chip); color: var(--muted); }
  .mine-btn { display: block; margin: 18px auto 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .chip { background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .chip.red { background: var(--bad-bg); color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
  td.late { color: var(--bad); }
  .memo { font-size: 12px; color: var(--muted); }
  .note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 16px; }
  .inapp { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
  #reqCard { margin-top: 14px; }
  h3 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 20px 0 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); border-radius: 12px; padding: 4px; }
  .seg button { height: 40px; border: 0; background: none; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  .f { margin-top: 12px; }
  .f > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .f input[type=text], .f input[type=date], .f input[type=time], .f select {
    width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text);
    font: inherit; font-size: 16px; padding: 0 12px; -webkit-appearance: none; appearance: none;
  }
  .radios { display: flex; gap: 18px; height: 40px; align-items: center; }
  .radios label { display: flex; gap: 6px; align-items: center; font-size: 16px; }
  .send { width: 100%; height: 50px; margin-top: 14px; border: 0; border-radius: 12px; background: var(--out); color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
  .send:disabled { opacity: .5; }
  .rmsg { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--in-bg); color: var(--in); }
  .rmsg.bad { background: var(--bad-bg); color: var(--bad); }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .item:last-child { border-bottom: 0; }
  .item .what { flex: 1; min-width: 0; }
  .item .sub { font-size: 12px; color: var(--muted); }
  .sbtn { height: 36px; padding: 0 12px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sbtn.go { background: var(--out); color: #fff; }
  .sbtn.ghost { background: var(--chip); color: var(--text); }
  .swapbox { background: var(--out-bg); border-radius: 14px; padding: 4px 14px; margin-bottom: 14px; }
  .swapbox .t { font-size: 13px; font-weight: 700; color: var(--out); padding-top: 8px; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .badge.wait { background: var(--warn-bg); color: var(--warn); }
  .badge.ok { background: var(--in-bg); color: var(--in); }
  .badge.no { background: var(--bad-bg); color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="store" id="store">출퇴근</div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">&nbsp;</div>
  </header>

  <div class="inapp" id="inapp" hidden>
    <b>카톡 안에서 열렸어요.</b> 카톡 안에서 찍으면 나중에 사파리·크롬으로 열었을 때 "새 폰"으로 인식될 수 있어요.
    오른쪽 위(또는 아래) <b>⋯ → 다른 브라우저로 열기</b>를 누른 뒤, 그 브라우저에서 <b>홈 화면에 추가</b>해서 쓰세요.
  </div>

  <section class="card" id="pick" hidden>
    <h2>본인 이름을 눌러주세요</h2>
    <div id="names"></div>
  </section>

  <section class="card" id="me" hidden>
    <div class="row">
      <div class="who" id="who"></div>
      <button class="link" id="change">다른 사람</button>
    </div>
    <div class="today" id="today">&nbsp;</div>

    <div id="pinBox">
      <p class="pinhint" id="pinHint" hidden>처음이에요! 앞으로 쓸 <b>비밀번호 4자리</b>를 정해서 넣고 출근을 누르세요. 다음부터는 이 번호로 찍어요.</p>
      <label class="pin" for="pin" id="pinLabel">비밀번호</label>
      <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
      <label class="check"><input type="checkbox" id="remember" checked> 이 폰에서 비밀번호 기억하기</label>
    </div>

    <div class="btns">
      <button class="big in" id="btnIn">출근</button>
      <button class="big out" id="btnOut">퇴근</button>
    </div>

    <div class="result" id="result" hidden><div class="t" id="rt"></div><div id="rs"></div></div>

    <button class="link mine-btn" id="mineBtn">이번 달 내 기록 보기</button>
    <div id="mine" hidden></div>
  </section>

  <section class="card" id="reqCard" hidden>
    <h2>요청 · 대타</h2>
    <div id="swaps"></div>
    <div class="seg" id="kinds">
      <button data-kind="fix">기록 정정</button>
      <button data-kind="off">휴무 신청</button>
      <button data-kind="swap">대타 구하기</button>
    </div>
    <form id="reqForm" hidden>
      <p class="hint" id="fHint"></p>
      <div class="f" id="wDateFix"><label for="fDateFix">날짜</label><select id="fDateFix"></select></div>
      <div class="f" id="wDate"><label for="fDate">날짜</label><input type="date" id="fDate"></div>
      <div class="f" id="wOff">
        <label>무엇으로</label>
        <div class="radios">
          <label><input type="radio" name="foff" value="휴무" checked> 휴무</label>
          <label><input type="radio" name="foff" value="월차"> 월차</label>
          <label><input type="radio" name="foff" value="반차"> 반차</label>
        </div>
      </div>
      <div class="f" id="wType">
        <label>무엇을</label>
        <div class="radios">
          <label><input type="radio" name="ftype" value="in"> 출근</label>
          <label><input type="radio" name="ftype" value="out" checked> 퇴근</label>
        </div>
      </div>
      <div class="f" id="wTime"><label for="fTime">실제 시간</label><input type="time" id="fTime"></div>
      <div class="f"><label for="fReason" id="fReasonLabel">사유</label><input type="text" id="fReason" maxlength="100"></div>
      <button class="send" id="fSend" type="submit">요청 보내기</button>
    </form>
    <p class="rmsg" id="reqMsg" hidden></p>
    <h3>내 요청</h3>
    <div id="myReqs"><p class="hint">불러오는 중…</p></div>
  </section>

  <p class="note" id="note" hidden></p>
</main>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var mem = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} },
  };
  var S = { info: null, me: null, today: null, busy: false };

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, no) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
        no(new Error((e && e.message) || String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* 이 폰의 고유 번호: 처음 열 때 한 번 만들어서 폰에 저장해요. 저장이 안 되는 브라우저면 ''. */
  function deviceId() {
    var id = mem.get('att:device');
    if (id && /^[0-9a-f]{16}$/.test(id)) return id;
    try {
      var a = new Uint8Array(8);
      crypto.getRandomValues(a);
      id = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    } catch (e) { return ''; }
    mem.set('att:device', id);
    return mem.get('att:device') === id ? id : '';
  }
  function deviceLabel() {
    var ua = navigator.userAgent;
    var os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' :
      /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : '기타';
    var br = /KAKAOTALK/i.test(ua) ? '카톡' : /NAVER/.test(ua) ? '네이버앱' : /SamsungBrowser/.test(ua) ? '삼성인터넷' :
      /CriOS|Chrome/.test(ua) ? '크롬' : /Safari/.test(ua) ? '사파리' : '브라우저';
    var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    return os + ' ' + br + (standalone ? '(홈화면)' : '');
  }
  var IN_APP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);

  function toMin(t) { var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
  function nowMin() {
    var p = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' }).format(new Date());
    return toMin(p);
  }
  function hm(min) {
    min = Math.round(min || 0);
    var h = Math.floor(min / 60), m = min % 60;
    return h ? h + '시간' + (m ? ' ' + m + '분' : '') : m + '분';
  }
  function won(n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; }

  function tick() {
    var d = new Date();
    $('clock').textContent = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Seoul' });
    $('date').textContent = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long', timeZone: 'Asia/Seoul' });
  }

  function show(id) {
    $('pick').hidden = id !== 'pick';
    $('me').hidden = id !== 'me';
    $('reqCard').hidden = id !== 'me';
  }
  function note(text) { $('note').hidden = !text; $('note').textContent = text || ''; }

  function result(kind, title, sub) {
    var box = $('result');
    box.className = 'result ' + kind;
    box.hidden = false;
    $('rt').textContent = title;
    $('rs').textContent = sub || '';
  }

  function renderNames() {
    var list = S.info.staff;
    if (!list.length) return ($('names').innerHTML = '<p class="note">[직원] 시트에 이름을 먼저 넣어주세요.</p>');
    var groups = [], by = {};
    list.forEach(function (p) {
      var k = p.store || '기타';
      if (!by[k]) { by[k] = []; groups.push(k); }
      by[k].push(p);
    });
    $('names').innerHTML = groups.map(function (g) {
      return (groups.length > 1 ? '<div class="group">' + esc(g) + '</div>' : '') + '<div class="grid">' +
        by[g].map(function (p) { return '<button class="name" data-name="' + esc(p.name) + '">' + esc(p.name) + '</button>'; }).join('') +
        '</div>';
    }).join('');
  }

  function renderPinBox() {
    var first = !S.me.pin;
    $('pinHint').hidden = !first;
    $('pinLabel').textContent = first ? '새 비밀번호 (숫자 4자리)' : '비밀번호';
  }

  function pick(name) {
    var p = null;
    S.info.staff.forEach(function (x) { if (x.name === name) p = x; });
    if (!p) return show('pick');
    S.me = p;
    S.today = null;
    mem.set('att:name', name);
    $('who').innerHTML = esc(name) + (p.store ? '<span class="storetag">' + esc(p.store) + '</span>' : '');
    renderPinBox();
    $('pin').value = mem.get('att:pin:' + name) || '';
    $('result').hidden = true;
    $('mine').hidden = true;
    show('me');
    loadToday();
    closeForm();
    REQ.data = null;
    loadReqs();
  }

  function loadToday() {
    $('today').textContent = '오늘 기록 불러오는 중…';
    return call('getToday', S.me.name).then(function (t) {
      S.today = t;
      renderToday();
    }).catch(function (e) { $('today').textContent = e.message; });
  }

  function renderToday() {
    var t = S.today;
    var parts = [t.sIn ? '오늘 근무 <b>' + esc(t.sIn) + (t.sOut ? ' ~ ' + esc(t.sOut) : ' 출근') + '</b>' : '오늘은 쉬는 날이에요'];
    if (t.tIn) parts.push('출근 <b>' + esc(t.tIn) + '</b>');
    if (t.tOut) parts.push('퇴근 <b>' + esc(t.tOut) + '</b>');
    $('today').innerHTML = parts.join(' · ');
    $('btnIn').disabled = !!t.tIn;
    $('btnOut').disabled = false;
  }

  function locate() {
    return new Promise(function (ok, no) {
      if (!navigator.geolocation) return no({ code: 0 });
      navigator.geolocation.getCurrentPosition(function (p) {
        ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy });
      }, no, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  }
  function geoError(e) {
    if (e && e.code === 1) return ['위치 권한이 꺼져 있어요', '휴대폰 설정에서 이 브라우저의 위치 권한을 "허용"으로 바꾼 뒤 다시 눌러주세요.'];
    if (e && e.code === 3) return ['위치 확인이 오래 걸려요', '창가 쪽에서 잠시 후 다시 눌러주세요.'];
    return ['위치를 확인하지 못했어요', '휴대폰 위치(GPS)를 켜고 다시 눌러주세요.'];
  }

  function setBusy(on) {
    S.busy = on;
    $('btnIn').disabled = on || !!(S.today && S.today.tIn);
    $('btnOut').disabled = on;
  }

  function punch(type) {
    if (S.busy) return;
    var pin = $('pin').value.trim();
    if (!pin) { result('bad', S.me.pin ? '비밀번호를 넣어주세요' : '앞으로 쓸 비밀번호 4자리를 정해서 넣어주세요'); $('pin').focus(); return; }
    var t = S.today;
    if (type === 'out' && t && t.sOut && !t.tOut) {
      var end = toMin(t.sOut), now = nowMin();
      if (end != null && now != null && now < end &&
          !confirm('퇴근 예정 시간(' + t.sOut + ')보다 일찍이에요.\n지금 퇴근을 찍을까요?')) return;
    }
    if (type === 'out' && t && t.tOut &&
        !confirm('오늘 ' + t.tOut + '에 이미 퇴근을 찍었어요.\n지금 시간으로 다시 찍을까요?')) return;

    setBusy(true);
    var label = type === 'in' ? '출근' : '퇴근';
    var getPos = S.info.mode === '안함' ? Promise.resolve(null) : (result('busy', '위치 확인 중…'), locate());
    getPos.then(function (pos) { return pos; }, function (err) {
      if (S.info.mode === '필수') { var m = geoError(err); throw new Error(m[0] + '\n' + m[1]); }
      return null;
    }).then(function (pos) {
      result('busy', label + ' 기록 중…');
      return call('punch', {
        name: S.me.name, pin: pin, type: type,
        lat: pos ? pos.lat : null, lng: pos ? pos.lng : null, acc: pos ? pos.acc : null,
        device: deviceId(), label: deviceLabel(),
      });
    }).then(function (r) {
      mem.set('att:pin:' + S.me.name, $('remember').checked && pin ? pin : null);
      if (!S.me.pin) { S.me.pin = true; renderPinBox(); }
      S.today = r.today;
      var sub;
      if (r.type === 'in') {
        sub = r.late ? r.late + '분 지각으로 기록됐어요.' : '정상 출근으로 기록됐어요.';
      } else {
        sub = r.work != null ? '오늘 ' + hm(r.work) + ' 근무했어요.' : '출근 기록이 없어서 사장님께 표시돼요.';
        if (r.early) sub += ' (예정보다 ' + r.early + '분 일찍 퇴근)';
      }
      result(r.late || r.early ? 'warn' : 'ok', label + ' 완료 · ' + r.time, sub);
      if (!$('mine').hidden) loadMine();
      if (!REQ.data) loadReqs();
    }).catch(function (e) {
      // 첫 문장은 크게, 나머지는 작게
      var msg = String(e.message);
      var m = /^(.+?[.!?])[\s\n]+([\s\S]+)$/.exec(msg) || /^(.+?)\n([\s\S]+)$/.exec(msg);
      if (!m) return result('bad', msg);
      result('bad', m[1], m[2].replace(/\n/g, ' '));
    }).then(function () {
      setBusy(false);
      if (S.today) renderToday();
    });
  }

  function loadMine() {
    var box = $('mine');
    box.hidden = false;
    box.innerHTML = '<p class="note">불러오는 중…</p>';
    call('getMyMonth', S.me.name, $('pin').value.trim(), '').then(function (r) {
      var t = r.total;
      var chips = [
        '근무 ' + t.days + '일', '총 ' + hm(t.work),
        '<span class="chip' + (t.lateCount ? ' red' : '') + '">지각 ' + t.lateCount + '회' + (t.lateMin ? ' · ' + t.lateMin + '분' : '') + '</span>',
      ];
      if (t.deduct) chips.push('<span class="chip red">차감 ' + won(t.deduct) + '</span>');
      var html = '<div class="chips">' + chips.map(function (c) { return c.indexOf('<span') === 0 ? c : '<span class="chip">' + c + '</span>'; }).join('') + '</div>';
      if (!r.rows.length) return (box.innerHTML = html + '<p class="note">이번 달 기록이 아직 없어요.</p>');
      html += '<table><thead><tr><th>날짜</th><th>출근</th><th>퇴근</th><th>지각</th></tr></thead><tbody>';
      r.rows.slice().reverse().forEach(function (x) {
        html += '<tr><td>' + esc(x.date.slice(5).replace('-', '/')) + ' ' + esc(x.dow) +
          (x.memo ? '<div class="memo">' + esc(x.memo) + '</div>' : '') + '</td><td>' + esc(x.tIn || '-') + '</td><td>' +
          esc(x.tOut || '-') + '</td><td class="' + (x.late ? 'late' : '') + '">' + (x.late ? x.late + '분' : '') + '</td></tr>';
      });
      box.innerHTML = html + '</tbody></table>';
    }).catch(function (e) { box.innerHTML = '<p class="note">' + esc(e.message) + '</p>'; });
  }

  $('names').addEventListener('click', function (e) {
    var b = e.target.closest('[data-name]');
    if (b) pick(b.getAttribute('data-name'));
  });
  $('change').addEventListener('click', function () { mem.set('att:name', null); show('pick'); });
  $('btnIn').addEventListener('click', function () { punch('in'); });
  $('btnOut').addEventListener('click', function () { punch('out'); });
  $('mineBtn').addEventListener('click', function () {
    if ($('mine').hidden) loadMine(); else $('mine').hidden = true;
  });

  /* ───── 요청 · 대타 ───── */
  var REQ = { kind: '', data: null };
  var KIND = { '정정': '기록 정정', '휴무': '휴무', '월차': '월차', '반차': '반차', '대타': '대타' };

  function kstDate(plusDays) {
    return new Date(Date.now() + 9 * 3600e3 + (plusDays || 0) * 864e5).toISOString().slice(0, 10);
  }
  function dayLabel(date) {
    var p = date.split('-').map(Number);
    var dow = '일월화수목금토'.charAt(new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay());
    return p[1] + '/' + p[2] + '(' + dow + ')';
  }
  function reqMsg(text, bad) {
    $('reqMsg').hidden = !text;
    $('reqMsg').className = 'rmsg' + (bad ? ' bad' : '');
    $('reqMsg').textContent = text || '';
  }

  function loadReqs() {
    var pin = $('pin').value.trim();
    if (!S.me.pin) {
      $('myReqs').innerHTML = '<p class="hint">처음 출근을 찍어서 비밀번호를 정하면 요청 기능을 쓸 수 있어요.</p>';
      $('swaps').innerHTML = '';
      return;
    }
    if (!pin) {
      $('myReqs').innerHTML = '<p class="hint">비밀번호를 넣으면 내 요청과 대타 구함이 보여요.</p>';
      $('swaps').innerHTML = '';
      return;
    }
    call('getRequests', S.me.name, pin).then(renderReqs).catch(function (e) {
      $('myReqs').innerHTML = '<p class="hint">' + esc(e.message) + '</p>';
    });
  }

  function stateBadge(r) {
    var me = S.me.name;
    if (r.state === '대기') return '<span class="badge wait">' + (r.kind === '대타' ? '대타 구하는 중' : '승인 대기') + '</span>';
    if (r.state === '수락') return '<span class="badge wait">' + (r.name === me ? esc(r.taker) + ' 수락 · 승인 대기' : '내가 대타 · 승인 대기') + '</span>';
    if (r.state === '승인') return '<span class="badge ok">승인' + (r.taker === me ? ' · 내가 대타' : '') + '</span>';
    if (r.state === '거절') return '<span class="badge no">거절</span>';
    return '<span class="badge">' + esc(r.state) + '</span>';
  }

  function renderReqs(d) {
    REQ.data = d;
    var me = S.me.name;
    $('swaps').innerHTML = d.swaps.length ? '<div class="swapbox"><div class="t">동료가 대타를 구해요</div>' + d.swaps.map(function (r) {
      return '<div class="item"><div class="what"><b>' + dayLabel(r.date) + '</b> ' + esc(r.what) +
        '<div class="sub">' + esc(r.name) + ' 님 대신</div></div>' +
        '<button class="sbtn go" data-take="' + esc(r.id) + '">제가 할게요</button></div>';
    }).join('') + '</div>' : '';
    $('myReqs').innerHTML = d.mine.length ? d.mine.map(function (r) {
      var what = r.kind === '정정' ? r.what : r.what + ' ' + r.kind;
      var who = r.name === me ? '' : '<div class="sub">' + esc(r.name) + ' 님 대신 근무</div>';
      var canCancel = (r.name === me && (r.state === '대기' || r.state === '수락')) || (r.taker === me && r.state === '수락');
      return '<div class="item"><div class="what"><b>' + esc(KIND[r.kind] || r.kind) + '</b> ' + dayLabel(r.date) + ' ' + esc(what) +
        who + (r.reason ? '<div class="sub">' + esc(r.reason) + '</div>' : '') + '<div style="margin-top:4px">' + stateBadge(r) + '</div></div>' +
        (canCancel ? '<button class="sbtn ghost" data-cancel="' + esc(r.id) + '">' + (r.name === me ? '취소' : '수락 취소') + '</button>' : '') + '</div>';
    }).join('') : '<p class="hint">아직 보낸 요청이 없어요.</p>';
  }

  var HINT = {
    fix: '출근이나 퇴근을 깜빡했거나 잘못 찍었을 때 실제 시간을 알려주세요. 사장님이 승인하면 기록이 고쳐져요.',
    off: '쉬고 싶은 날과 휴무·월차·반차 중 하나를 골라주세요. 사장님이 승인하면 휴무표에 그대로 적혀요.',
    swap: '대신 일해줄 동료를 구해요. 동료가 [제가 할게요]를 누르고 사장님이 승인하면 근무표가 바뀌어요.',
  };
  function openForm(kind) {
    if (REQ.kind === kind) return closeForm();
    REQ.kind = kind;
    Array.prototype.forEach.call(document.querySelectorAll('#kinds button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-kind') === kind);
    });
    var fix = kind === 'fix';
    $('reqForm').hidden = false;
    $('fHint').textContent = HINT[kind];
    $('wDateFix').hidden = !fix;
    $('wType').hidden = !fix;
    $('wTime').hidden = !fix;
    $('wDate').hidden = fix;
    $('wOff').hidden = kind !== 'off';
    if (fix) {
      var opts = '';
      for (var i = 0; i <= 14; i++) {
        var d = kstDate(-i);
        opts += '<option value="' + d + '">' + dayLabel(d) + (i === 0 ? ' 오늘' : i === 1 ? ' 어제' : '') + '</option>';
      }
      $('fDateFix').innerHTML = opts;
      $('fTime').value = '';
    } else {
      $('fDate').min = kstDate(0);
      $('fDate').max = kstDate(60);
      $('fDate').value = kstDate(1);
    }
    $('fReasonLabel').textContent = kind === 'swap' ? '사유 (선택, 사장님만 봐요)' : '사유 (사장님만 봐요)';
    $('fReason').placeholder = { fix: '예: 퇴근 찍는 걸 깜빡함', off: '예: 병원 예약', swap: '예: 집안 행사' }[kind];
    $('fReason').value = '';
    $('fSend').textContent = kind === 'swap' ? '대타 구하기' : '요청 보내기';
    reqMsg('');
  }
  function closeForm() {
    REQ.kind = '';
    $('reqForm').hidden = true;
    Array.prototype.forEach.call(document.querySelectorAll('#kinds button'), function (b) { b.classList.remove('on'); });
  }

  $('kinds').addEventListener('click', function (e) {
    var b = e.target.closest('[data-kind]');
    if (b) openForm(b.getAttribute('data-kind'));
  });
  $('reqForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('pin').value.trim();
    if (!S.me.pin) { reqMsg('먼저 출근을 한 번 찍어서 비밀번호를 정해주세요.', true); return; }
    if (!pin) { reqMsg('위에 비밀번호를 먼저 넣어주세요.', true); return; }
    var kind = REQ.kind;
    var typeEl = document.querySelector('input[name=ftype]:checked');
    var offEl = document.querySelector('input[name=foff]:checked');
    var body = {
      name: S.me.name, pin: pin, kind: kind,
      date: kind === 'fix' ? $('fDateFix').value : $('fDate').value,
      type: typeEl ? typeEl.value : 'out', time: $('fTime').value, reason: $('fReason').value,
      offType: offEl ? offEl.value : '휴무',
    };
    $('fSend').disabled = true;
    call('makeRequest', body).then(function (d) {
      renderReqs(d);
      closeForm();
      reqMsg(kind === 'swap' ? '대타 구함을 올렸어요. 동료가 수락하고 사장님이 승인하면 근무표가 바뀌어요.'
        : '요청을 보냈어요. 사장님이 승인하면 반영돼요.');
    }).catch(function (err) { reqMsg(err.message, true); })
      .then(function () { $('fSend').disabled = false; });
  });
  $('reqCard').addEventListener('click', function (e) {
    var t = e.target.closest('[data-take],[data-cancel]');
    if (!t) return;
    var pin = $('pin').value.trim();
    var take = t.hasAttribute('data-take');
    var id = t.getAttribute(take ? 'data-take' : 'data-cancel');
    if (!confirm(take ? '이 날 대신 근무할까요? 사장님이 승인하면 근무표가 바뀌어요.' : '이 요청을 취소할까요?')) return;
    t.disabled = true;
    call(take ? 'takeSwap' : 'cancelRequest', S.me.name, pin, id).then(function (d) {
      renderReqs(d);
      reqMsg(take ? '대타를 수락했어요. 사장님이 승인하면 근무표가 바뀌어요.' : '취소했어요.');
    }).catch(function (err) { t.disabled = false; reqMsg(err.message, true); });
  });
  $('pin').addEventListener('change', function () { if (!REQ.data) loadReqs(); });

  tick();
  setInterval(tick, 1000);
  $('inapp').hidden = !IN_APP;
  call('getStaffList').then(function (info) {
    S.info = info;
    $('store').textContent = info.store;
    document.title = info.store + ' 출퇴근';
    renderNames();
    var saved = mem.get('att:name');
    if (saved && info.staff.some(function (p) { return p.name === saved; })) pick(saved);
    else show('pick');
  }).catch(function (e) { note(e.message); });
</script>
</body>
</html>
